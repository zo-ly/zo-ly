<svg xmlns="http://www.w3.org/2000/svg" width="540" height="160" viewBox="0 0 540 160">
  <style>
    text { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #333333; dominant-baseline: middle }
    .percent { font-weight: 400 }
    .summary { font-size: 13px; font-weight: 400; fill: #6a737d }
    .empty { font-weight: 400; fill: #6a737d }
    .fade { opacity: 0; animation: fade 0.5s ease-in-out forwards }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 0.6s ease-in-out both }
    @keyframes fade { to { opacity: 1 } }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  </style>
  <rect width="540" height="160" rx="4.5" fill="#ffffff"/>
  <text class="summary fade" x="20" y="27" style="animation-delay:150ms">Last 7 days · 21h 51m total · 5h 29m best day</text>
  
  <g transform="translate(0, 50)">
    <text class="name fade" x="20" y="9" style="animation-delay:300ms">TypeScript</text>
    <g transform="translate(130, 2)">
      <rect class="bar" width="340.0" height="14" rx="3" fill="#3178c6" style="animation-delay:300ms"/>
    </g>
    <text class="percent fade" x="520" y="9" text-anchor="end" style="animation-delay:300ms">65%</text>
  </g>
  <g transform="translate(0, 74)">
    <text class="name fade" x="20" y="9" style="animation-delay:400ms">CSS</text>
    <g transform="translate(130, 2)">
      <rect class="bar" width="81.3" height="14" rx="3" fill="#663399" style="animation-delay:400ms"/>
    </g>
    <text class="percent fade" x="520" y="9" text-anchor="end" style="animation-delay:400ms">16%</text>
  </g>
  <g transform="translate(0, 98)">
    <text class="name fade" x="20" y="9" style="animation-delay:500ms">Markdown</text>
    <g transform="translate(130, 2)">
      <rect class="bar" width="67.9" height="14" rx="3" fill="#083fa1" style="animation-delay:500ms"/>
    </g>
    <text class="percent fade" x="520" y="9" text-anchor="end" style="animation-delay:500ms">13%</text>
  </g>
  <g transform="translate(0, 122)">
    <text class="name fade" x="20" y="9" style="animation-delay:600ms">Ruby</text>
    <g transform="translate(130, 2)">
      <rect class="bar" width="31.3" height="14" rx="3" fill="#701516" style="animation-delay:600ms"/>
    </g>
    <text class="percent fade" x="520" y="9" text-anchor="end" style="animation-delay:600ms">6%</text>
  </g>
  
</svg>
