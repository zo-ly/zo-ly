<svg xmlns="http://www.w3.org/2000/svg" width="540" height="202" viewBox="0 0 540 202">
  <style>
    text { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #333333; dominant-baseline: middle }
    .percent { font-weight: 400 }
    .empty { font-weight: 400; fill: #6a737d }
    .fade { opacity: 0; animation: fade 0.5s ease-in-out forwards }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 0.6s ease-in-out both }
    @keyframes fade { to { opacity: 1 } }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  </style>
  <rect width="540" height="202" rx="4.5" fill="#ffffff"/>
  
  <g transform="translate(0, 20)">
    <text class="name fade" x="20" y="9" style="animation-delay:300ms">Ruby</text>
    <g transform="translate(130, 2)">
      <rect class="bar" width="340.0" height="14" rx="3" fill="#701516" style="animation-delay:300ms"/>
    </g>
    <text class="percent fade" x="520" y="9" text-anchor="end" style="animation-delay:300ms">41%</text>
  </g>
  <g transform="translate(0, 44)">
    <text class="name fade" x="20" y="9" style="animation-delay:400ms">Markdown</text>
    <g transform="translate(130, 2)">
      <rect class="bar" width="337.8" height="14" rx="3" fill="#083fa1" style="animation-delay:400ms"/>
    </g>
    <text class="percent fade" x="520" y="9" text-anchor="end" style="animation-delay:400ms">40%</text>
  </g>
  <g transform="translate(0, 68)">
    <text class="name fade" x="20" y="9" style="animation-delay:500ms">TypeScript</text>
    <g transform="translate(130, 2)">
      <rect class="bar" width="61.6" height="14" rx="3" fill="#3178c6" style="animation-delay:500ms"/>
    </g>
    <text class="percent fade" x="520" y="9" text-anchor="end" style="animation-delay:500ms">7%</text>
  </g>
  <g transform="translate(0, 92)">
    <text class="name fade" x="20" y="9" style="animation-delay:600ms">JSON</text>
    <g transform="translate(130, 2)">
      <rect class="bar" width="29.5" height="14" rx="3" fill="#292929" style="animation-delay:600ms"/>
    </g>
    <text class="percent fade" x="520" y="9" text-anchor="end" style="animation-delay:600ms">4%</text>
  </g>
  <g transform="translate(0, 116)">
    <text class="name fade" x="20" y="9" style="animation-delay:700ms">TOML</text>
    <g transform="translate(130, 2)">
      <rect class="bar" width="28.9" height="14" rx="3" fill="#9c4221" style="animation-delay:700ms"/>
    </g>
    <text class="percent fade" x="520" y="9" text-anchor="end" style="animation-delay:700ms">3%</text>
  </g>
  <g transform="translate(0, 140)">
    <text class="name fade" x="20" y="9" style="animation-delay:800ms">Bash</text>
    <g transform="translate(130, 2)">
      <rect class="bar" width="10.0" height="14" rx="3" fill="#89e051" style="animation-delay:800ms"/>
    </g>
    <text class="percent fade" x="520" y="9" text-anchor="end" style="animation-delay:800ms">1%</text>
  </g>
  <g transform="translate(0, 164)">
    <text class="name fade" x="20" y="9" style="animation-delay:900ms">Other</text>
    <g transform="translate(130, 2)">
      <rect class="bar" width="27.9" height="14" rx="3" fill="#8b949e" style="animation-delay:900ms"/>
    </g>
    <text class="percent fade" x="520" y="9" text-anchor="end" style="animation-delay:900ms">3%</text>
  </g>
  
</svg>
